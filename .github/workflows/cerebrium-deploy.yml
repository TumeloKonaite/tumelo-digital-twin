name: Cerebrium Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        options:
          - dev
          - prod
        required: true
        default: dev
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  deployment:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || 'dev' }}
    concurrency:
      group: cerebrium-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || 'dev' }}
      cancel-in-progress: false
    env:
      ENV: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || 'dev' }}
      CEREBRIUM_SERVICE_ACCOUNT_TOKEN: ${{ secrets.CEREBRIUM_SERVICE_ACCOUNT_TOKEN }}
      CEREBRIUM_PROJECT_ID: ${{ vars.CEREBRIUM_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cerebrium CLI
        run: pip install cerebrium

      - name: Validate Cerebrium configuration
        run: |
          test -n "${CEREBRIUM_SERVICE_ACCOUNT_TOKEN}" || { echo "Missing CEREBRIUM_SERVICE_ACCOUNT_TOKEN"; exit 1; }
          test -n "${CEREBRIUM_PROJECT_ID}" || { echo "Missing CEREBRIUM_PROJECT_ID"; exit 1; }
          case "${CEREBRIUM_PROJECT_ID}" in
            p-*) ;;
            *) echo "Invalid CEREBRIUM_PROJECT_ID: must start with p-"; exit 1 ;;
          esac

      - name: Set Cerebrium project
        run: cerebrium project set "${CEREBRIUM_PROJECT_ID}"

      - name: Deploy app
        run: cerebrium deploy
