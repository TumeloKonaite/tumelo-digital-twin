name: Deploy to Modal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: pip install modal

      - name: Validate Modal credentials
        run: |
          test -n "${MODAL_TOKEN_ID}" || { echo "Missing MODAL_TOKEN_ID"; exit 1; }
          test -n "${MODAL_TOKEN_SECRET}" || { echo "Missing MODAL_TOKEN_SECRET"; exit 1; }

      - name: Deploy to Modal
        run: modal deploy modal_app.py
