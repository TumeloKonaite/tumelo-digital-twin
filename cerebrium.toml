[cerebrium.deployment]
name = "digital-twin-api"
python_version = "3.12"
include = ["src/**/*", "data/**/*", "main.py", "requirements.txt", "cerebrium.toml"]
exclude = [".*", "__pycache__", "*.pyc", "frontend/**/*", "tests/**/*"]
# Browser clients cannot safely hold a Cerebrium JWT. Set to true only if this
# endpoint is intentionally public and protected by your app-level auth/rate limits.
disable_auth = true

[cerebrium.runtime.custom]
port = 8000
entrypoint = ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
healthcheck_endpoint = "/health"
readycheck_endpoint = "/health"

[cerebrium.hardware]
cpu = 1
memory = 2.0

[cerebrium.scaling]
min_replicas = 0
max_replicas = 2
replica_concurrency = 10
cooldown = 60

[cerebrium.dependencies.paths]
pip = "requirements.txt"
